name: Remote testing
on:
  workflow_call:
    secrets:
      S3_LOG_EXTRACTION_PASSWORD:
        required: true
      CODECOV_CREDENTIALS:
        required: true

permissions: {}

env:
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / RemoteTests / ubuntu'
    # Action dashboard identified by 'Remote testing'
    # Requirement settings identified as 'RemoteTests / ubuntu'
    name: ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: git fetch --prune --unshallow --tags
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Global Setup
        run: python -m pip install -U pip

      # TODO: remove this step once s3-log-extraction 1.11.1 is released to PyPI. Pinned to the commit that merged
      # dandi/s3-log-extraction#297 (1.11.1): upstream main has since moved on to the cache-free 1.11.2, which #97 follows.
      - name: Temporary installation of the upstream development branch
        run: pip install --no-cache-dir "s3_log_extraction @ git+https://github.com/dandi/s3-log-extraction.git@85d3ec7735e8dc7e7933a007b801b93b65172b43"

      - name: Install local checkout
        run: pip install --no-cache-dir .[all] --group all

      - name: Display installed packages and their sources for debugging
        run: pip list

      - name: Ensure caching is working
        run: ls ~

      - name: Cache the IP to region mapping and GeoLite2 database between runs
        uses: actions/cache@v6
        id: enable_cache
        with:
          path: ~/.dandi_s3_log_extraction
          key: ubuntu_dandi_home_cache

      - if: steps.enable_cache.outputs.cache-hit == 'true'
        name: Ensure caching is working
        run: |
          ls ~
          ls ~/.s3_log_extraction
          cat ~/.s3_log_extraction/ip_hash_to_region.yaml

      # TODO: add remote tests and update to `pytest -m "remote"`
      - name: Run pytest with coverage and printout coverage for debugging
        run: |
          pytest -m "not remote" -vv -rsx --cov=dandi_s3_log_extraction --cov-report xml:./coverage.xml
          cat ./coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_CREDENTIALS }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
